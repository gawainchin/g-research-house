name: Refresh market watch

on:
  schedule:
    # After US market close, early morning Hong Kong.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Refresh static market watch snapshot
        run: npm run refresh:markets

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/market-watch.json; then
            echo "No market-watch snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-watch.json
          git commit -m "chore: refresh market watch snapshot"
          git push
